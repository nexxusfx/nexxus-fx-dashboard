<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXXUS FX hub - Professional Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .neon-glow { box-shadow: 0 0 20px rgba(0, 255, 136, 0.25); }
    .neon-border { border-color: #00FF88; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0A0E17; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #00FF88; }
  </style>
</head>
<body class="bg-[#0A0E17] text-slate-100 min-h-screen custom-scrollbar">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Estado de Autenticação (Login)
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [userEmail, setUserEmail] = useState('');
      const [userPassword, setUserPassword] = useState('');
      
      // Estado de Navegação e Configurações
      const [activeTab, setActiveTab] = useState('overview');
      const [theme, setTheme] = useState('neon'); // neon, white, dark
      const [showConnectModal, setShowConnectModal] = useState(false);
      const [selectedPlatform, setSelectedPlatform] = useState('mt5');
      
      // Dados Dinâmicos da Conta Conectada
      const [connectedAccounts, setConnectedAccounts] = useState([
        { id: 1, name: 'Exness Real MT5', broker: 'Exness', type: 'MT5', accountNumber: '88492011', balance: 12450.80, equity: 12890.20, status: 'Connected' }
      ]);
      const [activeAccountId, setActiveAccountId] = useState(1);
      
      // Dados da Conta Ativa
      const currentAccount = connectedAccounts.find(a => a.id === activeAccountId) || connectedAccounts[0];

      // Formulário de Nova Conexão
      const [connServer, setConnServer] = useState('');
      const [connAccount, setConnAccount] = useState('');
      const [connPassword, setConnPassword] = useState('');
      const [connApiKey, setConnApiKey] = useState('');

      const handleLogin = (e) => {
        e.preventDefault();
        if (userEmail && userPassword) {
          setIsAuthenticated(true);
        }
      };

      const handleConnectAccount = (e) => {
        e.preventDefault();
        const newAcc = {
          id: Date.now(),
          name: `${selectedPlatform.toUpperCase()} Account (${connAccount || 'API'})`,
          broker: connServer || selectedPlatform.toUpperCase(),
          type: selectedPlatform.toUpperCase(),
          accountNumber: connAccount || '8890123',
          balance: 10000.00,
          equity: 10000.00,
          status: 'Connected'
        };
        setConnectedAccounts([...connectedAccounts, newAcc]);
        setActiveAccountId(newAcc.id);
        setShowConnectModal(false);
        setConnServer(''); setConnAccount(''); setConnPassword(''); setConnApiKey('');
        alert(`Conta ${selectedPlatform.toUpperCase()} conectada com sucesso em modo Read-Only!`);
      };

      // TELA DE LOGIN (Se não estiver autenticado)
      if (!isAuthenticated) {
        return (
          <div class="min-h-screen flex items-center justify-center p-4 bg-[#0A0E17] text-slate-100">
            <div class="max-w-md w-full bg-[#111827] border border-slate-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
              <div class="absolute -top-10 -right-10 w-32 h-32 bg-[#00FF88]/10 rounded-full blur-2xl"></div>
              
              <div class="text-center mb-8">
                <div class="flex items-center justify-center gap-2 mb-2">
                  <div class="w-8 h-8 rounded-lg bg-[#00FF88] flex items-center justify-center font-extrabold text-black text-xl">N</div>
                  <span class="text-2xl font-extrabold tracking-wider font-mono text-white">NEXXUS <span class="text-[#00FF88]">FX</span></span>
                </div>
                <p class="text-xs text-slate-400">Entre para acessar seu Dashboard & Hub de Trading</p>
              </div>

              <form onSubmit={handleLogin} class="space-y-5">
                <div>
                  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">E-mail do Assinante</label>
                  <input 
                    type="email" 
                    required 
                    value={userEmail}
                    onChange={(e) => setUserEmail(e.target.value)}
                    placeholder="seu.email@exemplo.com"
                    class="w-full bg-[#0A0E17] border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#00FF88]"
                  />
                </div>

                <div>
                  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Senha</label>
                  <input 
                    type="password" 
                    required 
                    value={userPassword}
                    onChange={(e) => setUserPassword(e.target.value)}
                    placeholder="••••••••"
                    class="w-full bg-[#0A0E17] border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#00FF88]"
                  />
                </div>

                <div class="flex items-center justify-between text-xs text-slate-400">
                  <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" defaultChecked class="rounded bg-slate-800 border-slate-700 text-[#00FF88]" />
                    <span>Lembrar acesso</span>
                  </label>
                  <a href="#" class="text-[#00FF88] hover:underline">Esqueceu a senha?</a>
                </div>

                <button 
                  type="submit"
                  class="w-full bg-[#00FF88] hover:bg-[#00e67a] text-black font-bold py-3.5 rounded-xl transition-all font-mono tracking-wider shadow-lg shadow-[#00FF88]/20"
                >
                  ACESSAR DASHBOARD
                </button>
              </form>

              <div class="mt-6 text-center text-xs text-slate-500 border-t border-slate-800/80 pt-4">
                Ainda não tem assinatura? <a href="#" class="text-[#00FF88] font-semibold hover:underline">Escolher Plano SaaS</a>
              </div>
            </div>
          </div>
        );
      }

      // TELA PRINCIPAL DO DASHBOARD
      return (
        <div class="min-h-screen flex flex-col bg-[#0A0E17] text-slate-100">
          
          {/* HEADER PRINCIPAL */}
          <header class="bg-[#111827] border-b border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-40">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-[#00FF88] flex items-center justify-center font-extrabold text-black text-xl shadow-lg shadow-[#00FF88]/20">N</div>
              <div>
                <span class="text-xl font-extrabold tracking-wider font-mono text-white">NEXXUS <span class="text-[#00FF88]">FX</span></span>
                <span class="text-[10px] bg-[#00FF88]/10 text-[#00FF88] border border-[#00FF88]/30 px-2 py-0.5 rounded-full ml-2 font-mono">PRO HUB</span>
              </div>
            </div>

            {/* SELETOR DE CONTA E BOTÃO CONECTAR */}
            <div class="flex items-center gap-3">
              <div class="bg-[#0A0E17] border border-slate-700 rounded-xl px-3 py-1.5 flex items-center gap-2 text-xs">
                <span class="w-2 h-2 rounded-full bg-[#00FF88] animate-pulse"></span>
                <span class="text-slate-400">Conta Ativa:</span>
                <select 
                  value={activeAccountId} 
                  onChange={(e) => setActiveAccountId(Number(e.target.value))}
                  class="bg-transparent text-white font-mono font-bold focus:outline-none cursor-pointer"
                >
                  {connectedAccounts.map(acc => (
                    <option key={acc.id} value={acc.id} class="bg-[#111827] text-white">
                      {acc.name} (${acc.balance.toLocaleString()})
                    </option>
                  ))}
                </select>
              </div>

              <button 
                onClick={() => setShowConnectModal(true)}
                class="bg-[#00FF88] hover:bg-[#00e67a] text-black font-bold px-4 py-2 rounded-xl text-xs font-mono transition-all flex items-center gap-1.5 shadow-md shadow-[#00FF88]/10"
              >
                <span>⚡</span> CONECTAR CONTA
              </button>

              <button 
                onClick={() => setIsAuthenticated(false)}
                class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-2 rounded-xl border border-slate-700 transition-all"
                title="Sair da Conta"
              >
                Sair
              </button>
            </div>
          </header>

          {/* BARRA DE NAVEGAÇÃO DAS ABAS */}
          <nav class="bg-[#0D131F] border-b border-slate-800 px-6 py-2 flex items-center gap-2 overflow-x-auto custom-scrollbar">
            {[
              { id: 'overview', label: '📊 Overview' },
              { id: 'portfolio', label: '💼 Meu Portfólio' },
              { id: 'execution', label: '⚡ Execução & Live' },
              { id: 'risk', label: '🎯 Risco & Lotes' },
              { id: 'analytics', label: '📈 Analytics' },
              { id: 'diary', label: '📔 Diário de Trading' },
              { id: 'social', label: '📸 Cards Sociais' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                class={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all font-mono ${
                  activeTab === tab.id 
                    ? 'bg-[#00FF88]/10 text-[#00FF88] border border-[#00FF88]/40 shadow-sm' 
                    : 'text-slate-400 hover:text-white hover:bg-slate-800/50'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          {/* CONTEÚDO PRINCIPAL DA ABA SELECIONADA */}
          <main class="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
            
            {/* CARDS DE RESUMO NO TOPO */}
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
              <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4">
                <span class="text-xs text-slate-400 font-mono">SALDO DA CONTA</span>
                <div class="text-2xl font-bold font-mono text-white mt-1">${currentAccount.balance.toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
                <span class="text-[10px] text-[#00FF88] font-mono">🟢 Conectado via {currentAccount.type}</span>
              </div>

              <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4">
                <span class="text-xs text-slate-400 font-mono">PATRIMÔNIO (EQUITY)</span>
                <div class="text-2xl font-bold font-mono text-white mt-1">${currentAccount.equity.toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
                <span class="text-[10px] text-[#00FF88] font-mono">+3.52% no Mês</span>
              </div>

              <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4">
                <span class="text-xs text-slate-400 font-mono">P&L ATUAL (HOJE)</span>
                <div class="text-2xl font-bold font-mono text-[#00FF88] mt-1">+$439.40</div>
                <span class="text-[10px] text-slate-400 font-mono">4 operações encerradas</span>
              </div>

              <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4">
                <span class="text-xs text-slate-400 font-mono">WIN RATE</span>
                <div class="text-2xl font-bold font-mono text-white mt-1">78.4%</div>
                <span class="text-[10px] text-[#00FF88] font-mono">Profit Factor: 2.34</span>
              </div>
            </div>

            {/* CONTEÚDO ESPECÍFICO DE CADA ABA */}
            {activeTab === 'overview' && (
              <div class="bg-[#111827] border border-slate-800 rounded-2xl p-6 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                  <h2 class="text-lg font-bold font-mono text-white">📊 Visão Geral da Conta {currentAccount.name}</h2>
                  <span class="text-xs text-[#00FF88] font-mono">Atualizado em tempo real</span>
                </div>
                <p class="text-sm text-slate-300">
                  Sua conta do servidor <strong class="text-white">{currentAccount.broker}</strong> está conectada em modo <strong>Read-Only</strong> via <strong>{currentAccount.type}</strong>. Todas as estatísticas de execuções, ordens abertas e histórico estão sendo sincronizadas automaticamente.
                </p>
              </div>
            )}

            {activeTab === 'portfolio' && (
              <div class="bg-[#111827] border border-slate-800 rounded-2xl p-6 space-y-4">
                <h2 class="text-lg font-bold font-mono text-white">💼 Meu Portfólio Global Multi-Ativos</h2>
                <p class="text-sm text-slate-400">Consolidação de Trading (MT5/cTrader), Criptomoedas (Kraken), Ações e Fundos (Banco Inter).</p>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-4">
                  <div class="p-4 bg-[#0A0E17] border border-slate-800 rounded-xl">
                    <span class="text-xs text-slate-400">Trading / Forex</span>
                    <div class="text-xl font-bold text-[#00FF88] font-mono">${currentAccount.balance.toLocaleString()}</div>
                  </div>
                  <div class="p-4 bg-[#0A0E17] border border-slate-800 rounded-xl">
                    <span class="text-xs text-slate-400">Kraken (Cripto)</span>
                    <div class="text-xl font-bold text-white font-mono">$18,450.00</div>
                  </div>
                  <div class="p-4 bg-[#0A0E17] border border-slate-800 rounded-xl">
                    <span class="text-xs text-slate-400">Banco Inter (Ações/FIIs)</span>
                    <div class="text-xl font-bold text-white font-mono">R$ 45,200.00</div>
                  </div>
                </div>
              </div>
            )}

            {/* DEMAIS ABAS SIMULADAS COM CONTEÚDO */}
            {['execution', 'risk', 'analytics', 'diary', 'social'].includes(activeTab) && (
              <div class="bg-[#111827] border border-slate-800 rounded-2xl p-6 text-center py-12 space-y-3">
                <div class="text-3xl">⚙️</div>
                <h3 class="text-lg font-bold text-white font-mono uppercase">Aba {activeTab.toUpperCase()} Ativa</h3>
                <p class="text-xs text-slate-400">Módulo totalmente sincronizado com a conta {currentAccount.name}.</p>
              </div>
            )}

          </main>

          {/* MODAL CONECTAR NOVA CONTA */}
          {showConnectModal && (
            <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-[#111827] border border-slate-800 rounded-2xl max-w-lg w-full p-6 space-y-6 relative">
                <button 
                  onClick={() => setShowConnectModal(false)}
                  class="absolute top-4 right-4 text-slate-400 hover:text-white"
                >✕</button>

                <div>
                  <h3 class="text-lg font-bold text-white font-mono flex items-center gap-2">
                    <span>🔗</span> Conectar Nova Conta de Negociação
                  </h3>
                  <p class="text-xs text-slate-400 mt-1">Conexão 100% segura em Modo Read-Only (Apenas Leitura).</p>
                </div>

                {/* SELETOR DE PLATAFORMA */}
                <div>
                  <label class="block text-xs text-slate-400 font-mono mb-2 uppercase">1. Selecione a Plataforma</label>
                  <div class="grid grid-cols-4 gap-2">
                    {[
                      { id: 'mt5', label: 'MT5 / MT4' },
                      { id: 'ctrader', label: 'cTrader' },
                      { id: 'kraken', label: 'Kraken' },
                      { id: 'inter', label: 'Banco Inter' }
                    ].map(p => (
                      <button
                        key={p.id}
                        type="button"
                        onClick={() => setSelectedPlatform(p.id)}
                        class={`py-2 rounded-xl text-xs font-mono border transition-all ${
                          selectedPlatform === p.id 
                            ? 'bg-[#00FF88]/10 text-[#00FF88] border-[#00FF88]' 
                            : 'bg-[#0A0E17] border-slate-800 text-slate-400'
                        }`}
                      >
                        {p.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* FORMULÁRIO DE ACORDO COM A PLATAFORMA */}
                <form onSubmit={handleConnectAccount} class="space-y-4">
                  {selectedPlatform === 'mt5' && (
                    <>
                      <div>
                        <label class="block text-xs text-slate-400 mb-1">Servidor da Corretora (Broker Server)</label>
                        <input type="text" required placeholder="Ex: Exness-Real, FTMO-Server" value={connServer} onChange={e=>setConnServer(e.target.value)} class="w-full bg-[#0A0E17] border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
                      </div>
                      <div>
                        <label class="block text-xs text-slate-400 mb-1">Número da Conta MT5/MT4</label>
                        <input type="text" required placeholder="Ex: 88492011" value={connAccount} onChange={e=>setConnAccount(e.target.value)} class="w-full bg-[#0A0E17] border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
                      </div>
                      <div>
                        <label class="block text-xs text-slate-400 mb-1">Senha do Investidor (Read-Only Password)</label>
                        <input type="password" required placeholder="Senha de Leitura (não use a senha Master)" value={connPassword} onChange={e=>setConnPassword(e.target.value)} class="w-full bg-[#0A0E17] border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
                      </div>
                    </>
                  )}

                  {selectedPlatform === 'kraken' && (
                    <>
                      <div>
                        <label class="block text-xs text-slate-400 mb-1">API Key (Read-Only)</label>
                        <input type="text" required placeholder="Sua API Key do Kraken Pro" value={connApiKey} onChange={e=>setConnApiKey(e.target.value)} class="w-full bg-[#0A0E17] border border-slate-700 rounded-xl p-2.5 text-xs text-white" />
                      </div>
                      <p class="text-[11px] text-slate-400 bg-[#0A0E17] p-3 rounded-xl border border-slate-800">
                        💡 <strong>Passo a passo Kraken:</strong> Acesse Kraken Pro &gt; Settings &gt; API &gt; Create Key. Ative apenas a permissão <em>Query Funds / Read-Only</em>.
                      </p>
                    </>
                  )}

                  {selectedPlatform === 'inter' && (
                    <div class="text-center py-4 space-y-3 bg-[#0A0E17] p-4 rounded-xl border border-slate-800">
                      <p class="text-xs text-slate-300">Conexão segura via <strong>Open Finance Brasil</strong> (Banco Central).</p>
                      <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-4 py-2 rounded-xl text-xs font-mono">
                        AUTENTICAR NO APP BANCO INTER
                      </button>
                    </div>
                  )}

                  {selectedPlatform !== 'inter' && (
                    <button type="submit" class="w-full bg-[#00FF88] hover:bg-[#00e67a] text-black font-bold py-3 rounded-xl text-xs font-mono">
                      SALVAR E CONECTAR CONTA
                    </button>
                  )}
                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
