<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXXUS FX Hub - Institutional Trading Platform</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Configuration for Themes & Colors -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              neon: '#00FF88',
              glow: 'rgba(0, 255, 136, 0.15)',
              darkBg: '#0A0E17',
              darkCard: '#111827',
              darkBorder: '#1F2937'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- React & React DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js for Quantitative Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4B5563;
    }
    
    /* Neon Glow Effects */
    .glow-neon {
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.25);
    }
    .text-glow {
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }
    
    /* Social Card Canvas Aesthetic Restored */
    .social-card-gradient {
      background: linear-gradient(135deg, #0f172a 0%, #020617 50%, #052e16 100%);
    }
  </style>
</head>
<body class="bg-[#0A0E17] text-gray-100 min-h-screen antialiased selection:bg-[#00FF88] selection:text-black">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- DICTIONARY & TRANSLATIONS (9 LANGUAGES) ---
    const i18n = {
      PT: {
        overview: "Visão Geral", execution: "Execução & Live", risk: "Calculadora de Risco",
        quant: "Quant Analytics", performance: "Performance", journal: "Diário de Trading",
        plan: "Plano de Trading", notifications: "Central de Notificações", antiTilt: "Guarda Anti-Tilt",
        quantLeak: "Quant Leak Analytics", ecoCalendar: "Calendário Econômico", propTracker: "Prop Firm Tracker",
        social: "Social Share & Audit", portfolio: "Meu Portfólio",
        settings: "Configurações", accounts: "Contas Conectadas", planTag: "Plano PRO",
        renewNotice: "Sua assinatura vence em 3 dias!", payNow: "Renovar Agora",
        addAccount: "Conectar Nova Conta", search: "Buscar...", close: "Fechar"
      },
      EN: {
        overview: "Overview", execution: "Execution & Live", risk: "Risk Calculator",
        quant: "Quant Analytics", performance: "Performance", journal: "Trading Journal",
        plan: "Trading Plan", notifications: "Notifications Hub", antiTilt: "Anti-Tilt Guard",
        quantLeak: "Quant Leak Analytics", ecoCalendar: "Economic Calendar", propTracker: "Prop Firm Tracker",

        renewNotice: "Your subscription expires in 3 days!", payNow: "Renew Now",
        addAccount: "Connect New Account", search: "Search...", close: "Close"
      },
      ES: {
        overview: "Visión General", execution: "Ejecución y Live", risk: "Calculadora de Riesgo",
        quant: "Análisis Cuantitativo", performance: "Rendimiento", journal: "Diario de Trading",
        plan: "Plan de Trading", notifications: "Notificaciones", antiTilt: "Guardia Anti-Tilt",
        quantLeak: "Quant Leak Analytics", ecoCalendar: "Calendario Económico", propTracker: "Prop Firm Tracker",
        social: "Social Share y Auditoría", portfolio: "Mi Portafolio",
        settings: "Configuraciones", accounts: "Cuentas Conectadas", planTag: "Plan PRO",
        renewNotice: "¡Su suscripción vence en 3 días!", payNow: "Renovar Ahora",
        addAccount: "Conectar Nueva Cuenta", search: "Buscar...", close: "Cerrar"
      },
      FR: { overview: "Aperçu", execution: "Exécution & Live", risk: "Calculateur de Risque", quant: "Quant Analytics", performance: "Performance", journal: "Journal de Trading", plan: "Plan de Trading", notifications: "Notifications", antiTilt: "Garde Anti-Tilt", quantLeak: "Quant Leak Analytics", ecoCalendar: "Calendrier Économique", propTracker: "Prop Firm Tracker", social: "Partage Social & Audit", portfolio: "Mon Portefeuille", settings: "Paramètres", accounts: "Comptes Connectés", planTag: "Plan PRO", renewNotice: "Votre abonnement expire dans 3 jours!", payNow: "Renouveler", addAccount: "Ajouter un Compte", search: "Chercher...", close: "Fermer" },
      DE: { overview: "Übersicht", execution: "Ausführung & Live", risk: "Risikorechner", quant: "Quant Analytics", performance: "Leistung", journal: "Trading Tagebuch", plan: "Trading Plan", notifications: "Benachrichtigungen", antiTilt: "Anti-Tilt Schutz", quantLeak: "Quant Leak Analytics", ecoCalendar: "Wirtschaftskalender", propTracker: "Prop Firm Tracker", social: "Social Share & Audit", portfolio: "Mein Portfolio", settings: "Einstellungen", accounts: "Verbundene Konten", planTag: "PRO Plan", renewNotice: "Abonnement läuft in 3 Tagen ab!", payNow: "Jetzt Erneuern", addAccount: "Konto Verbinden", search: "Suchen...", close: "Schließen" },
      IT: { overview: "Panoramica", execution: "Esecuzione & Live", risk: "Calcolatore Rischio", quant: "Quant Analytics", performance: "Performance", journal: "Diario di Trading", plan: "Piano di Trading", notifications: "Notifiche", antiTilt: "Guardia Anti-Tilt", quantLeak: "Quant Leak Analytics", ecoCalendar: "Calendario Economico", propTracker: "Prop Firm Tracker", social: "Social Share & Audit", portfolio: "Il Mio Portafoglio", settings: "Impostazioni", accounts: "Account Connessi", planTag: "Piano PRO", renewNotice: "L'abbonamento scade tra 3 giorni!", payNow: "Rinnova Ora", addAccount: "Connetti Account", search: "Cerca...", close: "Chiudi" },
      JA: { overview: "概要", execution: "執行 & ライブ", risk: "リスク計算機", quant: "クオンツ分析", performance: "パフォーマンス", journal: "トレード日記", plan: "トレード計画", notifications: "通知センター", antiTilt: "アンチチルトガード", quantLeak: "Quant Leak Analytics", ecoCalendar: "経済指標カレンダー", propTracker: "プロップファーム", social: "ソーシャルシェア", portfolio: "ポートフォリオ", settings: "設定", accounts: "接続アカウント", planTag: "PROプラン", renewNotice: "サブスクリプションは3日で期限切れになります！", payNow: "今すぐ更新", addAccount: "口座を接続", search: "検索...", close: "閉じる" },
      ZH: { overview: "总览", execution: "执行与实盘", risk: "风险计算器", quant: "量化分析", performance: "绩效", journal: "交易日志", plan: "交易计划", notifications: "通知中心", antiTilt: "防倾斜保护", quantLeak: "Quant Leak Analytics", ecoCalendar: "财经日历", propTracker: "道具公司追踪", social: "社交分享与审计", portfolio: "我的投资组合", settings: "设置", accounts: "已连接账户", planTag: "PRO 计划", renewNotice: "您的订阅将在 3 天内到期！", payNow: "立即续订", addAccount: "连接新账户", search: "搜索...", close: "关闭" },
      RU: { overview: "Обзор", execution: "Исполнение и Live", risk: "Калькулятор Риска", quant: "Квант Аналитика", performance: "Результативность", journal: "Торговый Дневник", plan: "Торговый План", notifications: "Центр Уведомлений", antiTilt: "Защита Anti-Tilt", quantLeak: "Quant Leak Analytics", ecoCalendar: "Экономический Календарь", propTracker: "Prop Firm Tracker", social: "Соцсети и Аудит", portfolio: "Мой Портфель", settings: "Настройки", accounts: "Подключенные Счета", planTag: "План PRO", renewNotice: "Подписка истекает через 3 дня!", payNow: "Продлить", addAccount: "Подключить Счёт", search: "Поиск...", close: "Закрыть" }
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      // Core State
      const [currentView, setCurrentView] = useState("journal"); // Open restored journal as default to show changes
      const [lang, setLang] = useState("PT");
      const [theme, setTheme] = useState("default"); // 'default' (Padrão Neon), 'white', 'dark'
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isPaywallOpen, setIsPaywallOpen] = useState(false);
      const [showExpireBanner, setShowExpireBanner] = useState(true);

      // User Accounts & Limits State
      const [accounts, setAccounts] = useState([
        { id: "1098221", broker: "FTMO Real Server", type: "Prop Evaluation", balance: 100000, equity: 104250, profit: 4250, status: "Active" },
        { id: "5541092", broker: "IC Markets Raw", type: "Personal Live", balance: 25000, equity: 26180, profit: 1180, status: "Active" },
        { id: "8823104", broker: "FundedNext Master", type: "Prop Funded", balance: 200000, equity: 211400, profit: 11400, status: "Active" }
      ]);
      const currentTier = "PRO"; // Limits: Basic: 1, Essential: 5, PRO: 20
      const maxAccounts = 20;

      // Translation helper
      const t = i18n[lang] || i18n.PT;

      // Re-initialize Lucide Icons on view switch
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [currentView, isSettingsOpen, isPaywallOpen, theme]);

      // Dynamic Theme Classes
      const themeClasses = useMemo(() => {
        if (theme === 'white') {
          return {
            bg: 'bg-slate-100 text-slate-900',
            card: 'bg-white border-slate-200 shadow-sm text-slate-900',
            border: 'border-slate-200',
            sidebar: 'bg-white border-r border-slate-200 text-slate-800',
            accent: 'bg-emerald-600 text-white hover:bg-emerald-700',
            accentText: 'text-emerald-600',
            subtext: 'text-slate-500',
            input: 'bg-slate-50 border-slate-300 text-slate-900 focus:border-emerald-500'
          };
        } else if (theme === 'dark') {
          return {
            bg: 'bg-black text-gray-100',
            card: 'bg-zinc-950 border-zinc-800 text-gray-100',
            border: 'border-zinc-800',
            sidebar: 'bg-zinc-950 border-r border-zinc-800 text-gray-200',
            accent: 'bg-white text-black hover:bg-gray-200',
            accentText: 'text-white',
            subtext: 'text-zinc-400',
            input: 'bg-zinc-900 border-zinc-800 text-white focus:border-white'
          };
        } else {
          // Default: Deep Dark + Neon Green
          return {
            bg: 'bg-[#0A0E17] text-gray-100',
            card: 'bg-[#111827] border-[#1F2937] text-gray-100',
            border: 'border-[#1F2937]',
            sidebar: 'bg-[#0F172A] border-r border-[#1F2937] text-gray-200',
            accent: 'bg-[#00FF88] text-black font-semibold hover:bg-emerald-400 glow-neon',
            accentText: 'text-[#00FF88]',
            subtext: 'text-gray-400',
            input: 'bg-[#1A2332] border-[#2A364F] text-white focus:border-[#00FF88]'
          };
        }
      }, [theme]);

      return (
        <div className={`min-h-screen flex flex-col ${themeClasses.bg}`}>
          
          {/* Top Red Alert Countdown Banner (3-day grace period) */}
          {showExpireBanner && (
            <div className="bg-red-600/90 text-white px-4 py-2 text-xs md:text-sm font-medium flex items-center justify-between border-b border-red-500 backdrop-blur-sm sticky top-0 z-50">
              <div className="flex items-center gap-2 mx-auto sm:mx-0">
                <i data-lucide="alert-triangle" className="w-4 h-4 animate-pulse"></i>
                <span><strong>Atenção:</strong> Sua assinatura do Plano PRO expira em <strong>3 dias, 14 horas e 22 minutos</strong>.</span>
              </div>
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => setIsPaywallOpen(true)}
                  className="bg-white text-red-700 font-bold px-3 py-1 rounded text-xs hover:bg-red-50 transition"
                >
                  {t.payNow}
                </button>
                <button onClick={() => setShowExpireBanner(false)} className="text-white/80 hover:text-white">
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>
              </div>
            </div>
          )}

          <div className="flex flex-1 overflow-hidden">
            
            {/* --- SIDEBAR NAVIGATION --- */}
            <aside className={`w-64 flex-shrink-0 flex flex-col justify-between p-4 ${themeClasses.sidebar}`}>
              <div>
                {/* Logo & Branding */}
                <div className="flex items-center justify-between mb-8 px-2">
                  <div className="flex items-center gap-3">
                    <div className="w-9 h-9 rounded-xl bg-emerald-500/10 border border-[#00FF88]/30 flex items-center justify-center text-[#00FF88]">
                      <i data-lucide="activity" className="w-5 h-5"></i>
                    </div>
                    <div>
                      <h1 className="font-extrabold tracking-wider text-base leading-none">NEXXUS <span className={themeClasses.accentText}>FX</span></h1>
                      <span className="text-[10px] text-gray-400 tracking-widest uppercase font-mono">Institutional Hub</span>
                    </div>
                  </div>
                  <span className="bg-[#00FF88]/10 text-[#00FF88] text-[10px] font-bold px-2 py-0.5 rounded border border-[#00FF88]/20">
                    {t.planTag}
                  </span>
                </div>

                {/* Nav Items List */}
                <nav className="space-y-1">
                  {[
                    { id: "overview", label: t.overview, icon: "layout-dashboard" },
                    { id: "execution", label: t.execution, icon: "zap" },
                    { id: "risk", label: t.risk, icon: "calculator" },
                    { id: "quant", label: t.quant, icon: "bar-chart-3" },
                    { id: "performance", label: t.performance, icon: "trending-up" },
                    { id: "journal", label: t.journal, icon: "book-open", highlight: true },
                    { id: "plan", label: t.plan, icon: "file-text" },
                    { id: "notifications", label: t.notifications, icon: "bell" },
                    { id: "antiTilt", label: t.antiTilt, icon: "shield-alert" },
                    { id: "quantLeak", label: t.quantLeak, icon: "radar" },
                    { id: "ecoCalendar", label: t.ecoCalendar, icon: "calendar" },
                    { id: "propTracker", label: t.propTracker, icon: "award" },
                    { id: "social", label: t.social, icon: "share-2" },
                    { id: "portfolio", label: t.portfolio, icon: "pie-chart" }
                  ].map(item => (
                    <button
                      key={item.id}
                      onClick={() => setCurrentView(item.id)}
                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-medium transition ${
                        currentView === item.id
                          ? theme === 'white' ? 'bg-slate-200 text-emerald-700 font-bold' : 'bg-white/10 text-[#00FF88] font-bold'
                          : 'text-gray-400 hover:text-white hover:bg-white/5'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <i data-lucide={item.icon} className="w-4 h-4"></i>
                        <span>{item.label}</span>
                      </div>
                      {item.highlight && (
                        <span className="w-1.5 h-1.5 rounded-full bg-[#00FF88] animate-ping"></span>
                      )}
                    </button>
                  ))}
                </nav>
              </div>

              {/* Sidebar Footer & Quick Settings */}
              <div className="pt-4 border-t border-gray-800 space-y-2">
                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-gray-400 hover:text-white hover:bg-white/5"
                >
                  <div className="flex items-center gap-2">
                    <i data-lucide="settings" className="w-4 h-4"></i>
                    <span>{t.settings}</span>
                  </div>
                  <span className="text-[10px] bg-gray-800 px-1.5 py-0.5 rounded font-mono">{lang}</span>
                </button>

                <div className="p-3 rounded-lg bg-gray-900/50 border border-gray-800 text-xs">
                  <div className="flex items-center justify-between text-gray-400 mb-1">
                    <span>{t.accounts}</span>
                    <span className="font-mono text-white">{accounts.length}/{maxAccounts}</span>
                  </div>
                  <div className="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
                    <div className="bg-[#00FF88] h-full" style={{ width: `${(accounts.length / maxAccounts) * 100}%` }}></div>
                  </div>
                </div>
              </div>
            </aside>

            {/* --- MAIN CONTENT AREA --- */}
            <main className="flex-1 overflow-y-auto p-4 md:p-8">
              
              {/* RESTORED: DIÁRIO DE TRADING (Exact Previous Configuration & Layout) */}
              {currentView === "journal" && (
                <DiaryModule themeClasses={themeClasses} t={t} />
              )}

              {/* RESTORED: SOCIAL SHARE & AUDIT (Exact Previous Visual Aesthetics) */}
              {currentView === "social" && (
                <SocialShareModule themeClasses={themeClasses} t={t} />
              )}

              {/* MEU PORTFÓLIO */}
              {currentView === "portfolio" && (
                <PortfolioModule themeClasses={themeClasses} t={t} />
              )}

              {/* OVERVIEW MODULE */}
              {currentView === "overview" && (
                <div className="space-y-6">
                  <h2 className="text-2xl font-bold">Visão Geral da Conta</h2>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                    {[
                      { title: "Patrimônio Total", val: "$341,830.00", change: "+4.2%", pos: true },
                      { title: "Profit Factor", val: "2.14", change: "+0.18", pos: true },
                      { title: "Win Rate Total", val: "68.4%", change: "-1.2%", pos: false },
                      { title: "Max Drawdown", val: "2.8%", change: "-0.5%", pos: true }
                    ].map((s, i) => (
                      <div key={i} className={`p-5 rounded-xl ${themeClasses.card}`}>
                        <span className="text-xs text-gray-400 uppercase tracking-wider">{s.title}</span>
                        <div className="text-2xl font-mono font-bold mt-2">{s.val}</div>
                        <span className={`text-xs font-semibold mt-1 inline-block ${s.pos ? 'text-emerald-400' : 'text-rose-400'}`}>{s.change} este mês</span>
                      </div>
                    ))}
                  </div>
                  <div className={`p-6 rounded-xl ${themeClasses.card}`}>
                    <h3 className="font-bold text-lg mb-4">Evolução do Saldo Consolidado</h3>
                    <div className="h-64 flex items-center justify-center border border-dashed border-gray-800 rounded-lg text-gray-500 font-mono text-xs">
                      [Gráfico de Curva de Patrimônio MT5 / cTrader Live Sync]
                    </div>
                  </div>
                </div>
              )}

              {/* OTHER 11 MODULES PLACEHOLDERS FOR COMPLETE 14-PAGE COVERAGE */}
              {["execution", "risk", "quant", "performance", "plan", "notifications", "antiTilt", "quantLeak", "ecoCalendar", "propTracker"].includes(currentView) && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <h2 className="text-2xl font-bold">{t[currentView] || currentView}</h2>
                    <span className="text-xs font-mono text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">Módulo Ativo • Sync Institutional</span>
                  </div>
                  <div className={`p-8 rounded-xl ${themeClasses.card} flex flex-col items-center justify-center text-center py-20`}>
                    <div className="w-16 h-16 rounded-2xl bg-emerald-500/10 flex items-center justify-center text-[#00FF88] mb-4">
                      <i data-lucide="layers" className="w-8 h-8"></i>
                    </div>
                    <h3 className="text-xl font-bold mb-2">Painel de {t[currentView]}</h3>
                    <p className="text-gray-400 text-sm max-w-md">Todos os parâmetros quantitativos e logs operacionais sincronizados com o servidor primário NEXXUS FX.</p>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* --- SETTINGS DRAWER (9 Languages & 3 Themes) --- */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex justify-end">
              <div className={`w-full max-w-md h-full p-6 ${themeClasses.card} shadow-2xl flex flex-col justify-between overflow-y-auto`}>
                <div>
                  <div className="flex items-center justify-between pb-4 border-b border-gray-800">
                    <h3 className="font-bold text-lg flex items-center gap-2">
                      <i data-lucide="settings" className="w-5 h-5 text-[#00FF88]"></i>
                      {t.settings}
                    </h3>
                    <button onClick={() => setIsSettingsOpen(false)} className="text-gray-400 hover:text-white">
                      <i data-lucide="x" className="w-5 h-5"></i>
                    </button>
                  </div>

                  {/* Theme Selector */}
                  <div className="mt-6 space-y-3">
                    <label className="text-xs uppercase font-bold tracking-wider text-gray-400">Tema do Hub</label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { id: 'default', label: 'Padrão Neon', color: 'bg-[#0A0E17] border-[#00FF88]' },
                        { id: 'white', label: 'White Clean', color: 'bg-white border-slate-300 text-black' },
                        { id: 'dark', label: 'Pitch Dark', color: 'bg-black border-zinc-700' }
                      ].map(item => (
                        <button
                          key={item.id}
                          onClick={() => setTheme(item.id)}
                          className={`p-3 rounded-lg border text-xs font-medium text-center transition ${
                            theme === item.id ? 'ring-2 ring-[#00FF88]' : 'opacity-70 hover:opacity-100'
                          } ${item.color}`}
                        >
                          {item.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Language Selector (9 Languages) */}
                  <div className="mt-6 space-y-3">
                    <label className="text-xs uppercase font-bold tracking-wider text-gray-400">Idioma / Language</label>
                    <div className="grid grid-cols-3 gap-2">
                      {[
                        { code: 'PT', name: 'Português' },
                        { code: 'EN', name: 'English' },
                        { code: 'ES', name: 'Español' },
                        { code: 'FR', name: 'Français' },
                        { code: 'DE', name: 'Deutsch' },
                        { code: 'IT', name: 'Italiano' },
                        { code: 'JA', name: '日本語' },
                        { code: 'ZH', name: '中文' },
                        { code: 'RU', name: 'Русский' }
                      ].map(l => (
                        <button
                          key={l.code}

    // --- RESTORED MODULE 1: DIÁRIO DE TRADING (Exact Previous Configuration) ---
    function DiaryModule({ themeClasses, t }) {
      const [entries, setEntries] = useState([
        {
          id: 1,
          date: "2026-10-24",
          pair: "EURUSD",
          type: "BUY",
          result: "+$1,250.00",
          pips: "+28.4",
          timeframe: "M15",
          notes: "Entrada Perfeita no Liquidity Sweep da sessão de NY. Seguiu à risca o plano.",
          image: "https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=600&q=80"
        },
        {
          id: 2,
          date: "2026-10-23",
          pair: "XAUUSD",
          type: "SELL",
          result: "-$420.00",
          pips: "-14.0",
          timeframe: "H1",
          notes: "Hesitei no Fechamento. Saí antes do alvo de Fibonacci por ansiedade.",
          image: null
        }
      ]);

      const [filterPeriod, setFilterPeriod] = useState("Último mês");
      const [searchTerm, setSearchTerm] = useState("");
      const [newNotes, setNewNotes] = useState("");
      const [newPair, setNewPair] = useState("EURUSD");
      const [uploadedImage, setUploadedImage] = useState(null);

      // Handle Image Attachment Preview
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setUploadedImage(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      // Add New Diary Entry (+)
      const handleAddEntry = () => {
        if (!newNotes.trim()) return;
        const newEntryObj = {
          id: Date.now(),
          date: new Date().toISOString().split('T')[0],
          pair: newPair,
          type: "BUY",
          result: "+$850.00",
          pips: "+18.0",
          timeframe: "M15",
          notes: newNotes,
          image: uploadedImage
        };
        setEntries([newEntryObj, ...entries]);
        setNewNotes("");
        setUploadedImage(null);
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 className="text-2xl font-extrabold tracking-tight">Diário de Trading</h2>
              <p className="text-xs text-gray-400">Registro operacional ilimitado e histórico comportamental quantitativo.</p>

                  type="text"
                  placeholder="Buscar notas ou par..."

                  onChange={(e) => setSearchTerm(e.target.value)}
                  className={`pl-9 pr-3 py-2 text-xs rounded-lg border ${themeClasses.input}`}

              </div>

              <select
                value={filterPeriod}
                onChange={(e) => setFilterPeriod(e.target.value)}
                className={`py-2 px-3 text-xs rounded-lg border ${themeClasses.input}`}
              >
                <option>Última semana</option>
                <option>Último mês</option>
                <option>Último ano</option>
                <option>Período personalizado</option>
              </select>
            </div>
          </div>

          {/* New Operational Entry Log Input Block */}
          <div className={`p-5 rounded-xl ${themeClasses.card} border border-emerald-500/20`}>
            <h3 className="text-xs font-bold uppercase tracking-wider text-[#00FF88] mb-3 flex items-center gap-2">
              <i data-lucide="plus-circle" className="w-4 h-4"></i>
              Novo Registro Diário (+)
            </h3>
            <div className="grid grid-cols-1 md:grid-cols-4 gap-3 mb-3">
              <select 
                value={newPair} 
                onChange={(e) => setNewPair(e.target.value)}
                className={`p-2.5 text-xs rounded-lg border ${themeClasses.input}`}
              >
                <option>EURUSD</option>
                <option>GBPUSD</option>
                <option>XAUUSD</option>
                <option>BTCUSD</option>
                <option>US30</option>
              </select>

              <label className="flex items-center gap-2 cursor-pointer p-2.5 rounded-lg border border-dashed border-gray-700 bg-gray-900/30 hover:bg-gray-800/50 text-xs text-gray-400">

                <span>{uploadedImage ? "Imagem Anexada ✓" : "Anexar Print do Chart"}</span>
                <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
              </label>

              {uploadedImage && (
                <div className="relative w-12 h-10 rounded border border-gray-700 overflow-hidden">
                  <img src={uploadedImage} alt="Preview" className="w-full h-full object-cover" />
                  <button onClick={() => setUploadedImage(null)} className="absolute top-0 right-0 bg-red-600 text-white p-0.5">
                    <i data-lucide="x" className="w-3 h-3"></i>
                  </button>
                </div>
              )}
            </div>

            <textarea
              rows="2"
              placeholder="Descreva seu estado mental, contexto do mercado e o motivo da entrada..."
              value={newNotes}
              onChange={(e) => setNewNotes(e.target.value)}
              className={`w-full p-3 text-xs rounded-lg border mb-3 ${themeClasses.input}`}
            ></textarea>

            <button
              onClick={handleAddEntry}
              className={`px-5 py-2.5 rounded-lg text-xs font-bold flex items-center gap-2 ${themeClasses.accent}`}
            >
              <i data-lucide="plus" className="w-4 h-4"></i>
              Adicionar ao Diário
            </button>
          </div>

          {/* Behavioral Summary Blocks (Último mês, Último trimestre, Último semestre, Último ano) */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            {[
              { title: "Último Mês", winRate: "72%", discipline: "94%", tiltRisk: "Baixo" },
              { title: "Último Trimestre", winRate: "68%", discipline: "91%", tiltRisk: "Médio" },
              { title: "Último Semestre", winRate: "70%", discipline: "89%", tiltRisk: "Baixo" },

              <div key={i} className={`p-4 rounded-xl ${themeClasses.card}`}>
                <span className="text-[11px] font-bold text-gray-400 uppercase tracking-wider">{b.title}</span>
                <div className="mt-2 text-xs space-y-1">
                  <div className="flex justify-between">
                    <span className="text-gray-400">Win Rate:</span>
                    <span className="font-mono font-bold text-emerald-400">{b.winRate}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-400">Disciplina:</span>
                    <span className="font-mono text-white">{b.discipline}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-400">Risco Tilt:</span>
                    <span className="font-mono text-emerald-400">{b.tiltRisk}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* Diary Entries Log List */}
          <div className="space-y-4">
            {entries.map((item) => (
              <div key={item.id} className={`p-5 rounded-xl ${themeClasses.card} border-l-4 ${item.result.startsWith('+') ? 'border-l-emerald-500' : 'border-l-rose-500'}`}>
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-2 border-b border-gray-800/80 pb-3 mb-3">
                  <div className="flex items-center gap-3">
                    <span className="font-mono font-extrabold text-sm text-white">{item.pair}</span>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${item.type === 'BUY' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>
                      {item.type}
                    </span>
                    <span className="text-xs text-gray-400 font-mono">{item.timeframe}</span>
                  </div>
                  <div className="flex items-center gap-4 text-xs font-mono">
                    <span className="text-gray-400">{item.date}</span>
                    <span className={item.result.startsWith('+') ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}>
                      {item.result} ({item.pips} pips)
                    </span>
                  </div>
                </div>

                <p className="text-xs text-gray-300 leading-relaxed mb-3">{item.notes}</p>

                {item.image && (
                  <div className="mt-3 rounded-lg overflow-hidden border border-gray-800 max-w-md">
                    <img src={item.image} alt="Chart Snapshot" className="w-full h-auto object-cover hover:scale-105 transition duration-300" />
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }
